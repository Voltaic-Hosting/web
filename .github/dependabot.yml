version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      svelte:
        patterns:
          - svelte
          - '@lucide/svelte'
          - svelte-check
          - prettier-plugin-svelte
          - eslint-plugin-svelte
      tailwind-vite:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
          - vite
          - vitest
      lint:
        patterns:
          - eslint*
          - typescript-eslint
          - prettier*
          - typescript
          - '@eslint/js'
          - globals

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
