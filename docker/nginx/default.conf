# Voltaic Hosting website - static Astro build behind rootless nginx.
# dist uses build.format 'file', so extensionless routes resolve via $uri.html.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    client_max_body_size 8m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Only read methods. Anything else is a 405.
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # Dotfiles are private except ACME and friends.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /404.html;
    error_page 401 /errors/401.html;
    error_page 403 /errors/403.html;
    error_page 429 /errors/429.html;
    error_page 500 /errors/500.html;
    error_page 502 503 504 /errors/503.html;

    location = /404.html { internal; }
    location = /errors/401.html { internal; }
    location = /errors/403.html { internal; }
    location = /errors/429.html { internal; }
    location = /errors/500.html { internal; }
    location = /errors/503.html { internal; }

    location = /up {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Security headers live on the server block and must be repeated inside any
    # location that adds its own headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HTML: fingerprinted assets change per release, so always revalidate.
    location / {
        try_files $uri $uri.html $uri/ =404;

        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Astro emits hashed filenames under /_astro/: safe to cache forever.
    location /_astro/ {
        access_log off;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /sitemap.xml {
        types {}
        default_type application/xml;
        access_log off;

        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;

        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;

        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Unhashed static assets: images, brand art, icons, manifest. Seven days,
    # no immutable flag because filenames are stable across releases.
    location ~* \.(?:png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot|webmanifest|xml|txt|mp4|webm|pdf)$ {
        access_log off;
        try_files $uri =404;

        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
