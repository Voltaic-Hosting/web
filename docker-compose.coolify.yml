# Coolify Docker Compose deployment
# Docs: https://coolify.io/docs/knowledge-base/docker/compose
#
# In Coolify, set the Compose file to docker-compose.coolify.yml
# Assign a domain to the web service (container port 8080).
# Set required APP_KEY in the Coolify environment UI (base64:...).
#
# No host port mappings. Coolify's proxy reaches web on 8080 via
# SERVICE_URL_WEB_8080. The app service stays private (no domain, no ports).

services:
  app:
    build:
      context: .
      target: app
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-0.1.0}
    image: voltaic-website-app:${VERSION:-0.1.0}
    init: true
    restart: unless-stopped
    user: "82:82"
    read_only: true
    privileged: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:uid=82,gid=82,mode=1777,size=64m
      - /var/www/html/storage:uid=82,gid=82,mode=0755,size=64m
      - /var/www/html/bootstrap/cache:uid=82,gid=82,mode=0755,size=16m
    environment:
      - APP_KEY=${APP_KEY:?}
      - APP_URL=${SERVICE_URL_WEB}
      - LOG_LEVEL=${LOG_LEVEL:-warning}
      - APP_NAME=Voltaic Hosting
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_CHANNEL=stderr
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/storage/database.sqlite
      - SESSION_DRIVER=file
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - FILESYSTEM_DISK=local
      - BROADCAST_CONNECTION=log
      - MAIL_MAILER=log
      - INERTIA_SSR_ENABLED=false
    expose:
      - "9000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 256
    oom_score_adj: 200
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
        reservations:
          cpus: "0.10"
          memory: 128M

  web:
    build:
      context: .
      target: web
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-0.1.0}
    image: voltaic-website-web:${VERSION:-0.1.0}
    init: true
    restart: unless-stopped
    user: "101:101"
    read_only: true
    privileged: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777,size=16m
      - /var/cache/nginx:uid=101,gid=101,mode=0755,size=32m
      - /var/run:uid=101,gid=101,mode=0755,size=16m
    environment:
      - SERVICE_URL_WEB_8080
    expose:
      - "8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.50
    pids_limit: 64
    oom_score_adj: 100
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 64
        reservations:
          cpus: "0.05"
          memory: 32M
