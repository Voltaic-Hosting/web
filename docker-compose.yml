name: voltaic-website

services:
  web:
    build:
      context: .
      target: web
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-0.1.0}
    image: voltaic-website-web:${VERSION:-0.1.0}
    init: true
    restart: unless-stopped
    user: "101:101"
    read_only: true
    privileged: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777,size=16m
      - /var/cache/nginx:uid=101,gid=101,mode=0755,size=32m
      - /var/run:uid=101,gid=101,mode=0755,size=16m
    ports:
      - target: 8080
        published: ${HTTP_PORT:-8080}
        protocol: tcp
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.50
    pids_limit: 64
    oom_score_adj: 100
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 64
        reservations:
          cpus: "0.05"
          memory: 32M

networks:
  edge:
    driver: bridge
