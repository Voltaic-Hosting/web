name: voltaic-website

services:
  web:
    build:
      context: .
      target: web
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-0.1.0}
    image: voltaic-website-web:${VERSION:-0.1.0}
    init: true
    restart: unless-stopped
    read_only: true
    privileged: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777,size=32m
    ports:
      - target: 8080
        published: ${HTTP_PORT:-8080}
        protocol: tcp
    networks:
      - edge
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.50
    pids_limit: 64
    oom_score_adj: 100
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 64
        reservations:
          cpus: "0.05"
          memory: 32M

networks:
  edge:
    driver: bridge
